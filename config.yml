# Galaxy Profile README Configuration
# Copy this file to config.yml and customize it to make it your own!
#
# Usage:
#   cp config.example.yml config.yml
#   # Edit config.yml with your details
#   python -m generator.main
#
# Demo mode (no API calls, uses this file directly):
#   python -m generator.main --demo

# Your GitHub username (required)
username: Lucascfsb

# Profile information displayed in the galaxy header
profile:
  name: "Lucas C Fernandes"
  tagline: "Full Stack Developer & AI Enthusiast"
  company: "Exército Brasileiro"
  location: "Rio de Janeiro, Brazil"
  bio: |
    Criando ferramentas que facilitam a vida dos desenvolvedores.
    Apaixonado por sistemas distribuídos, experiência do desenvolvedor e o ecossistema de código aberto.
  philosophy: '"O melhor código é aquele que ajuda os outros."'

# Social links displayed at the bottom of the profile
social:
  email: "lucascfsb@gmail.com"
  linkedin: "lucascfsb"
  website: "https://lucascfsb.dev"

# Galaxy arms represent your core focus areas
# Each arm spirals out from the center with its own color and tech items
# Available colors: "synapse_cyan", "dendrite_violet", "axon_amber"
galaxy_arms:
  - name: "Frontend"
    color: "dendrite_violet"
    items:
      - "TypeScript"
      - "ReactJS"
      - "CSS"
      - "Tailwind"
  - name: "Backend"
    color: "synapse_cyan"
    items:
      - "Python"
      - "Node.js"
      - "PostgreSQL"
  - name: "DevOps"
    color: "axon_amber"
    items:
      - "Docker"
      - "GitHub Actions"
      - "Vercel"

# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "galaxy-dev/autoU-email"
    arm: 1
    description: "An email verification and response generation tool, based on the email, with AI."
  - repo: "galaxy-dev/quickList"
    arm: 0
    description: "A simple and modern web app to quickly create and manage your shopping list. "
  - repo: "galaxy-dev/number-generator"
    arm: 0
    description: "A web application to generate random numbers within a custom range."
  - repo: "galaxy-dev/ClipMaker"
    arm: 1
    description: "To work as a Full Stack Developer, contributing leadership experience, resilience, and complex problem-solving to scalable teams and systems."
  - repo: "galaxy-dev/pet-scheduling"
    arm: 0
    description: "A pet scheduling system built with pure JavaScript. It allows users to schedule services, view, and manage appointments within a responsive interface featuring modular code and interactive toast notifications."

# Theme color overrides (optional — defaults to deep space palette)
# All values must be valid hex color codes (#RRGGBB)
theme:
  void: "#080c14" # Darkest background
  nebula: "#0f1623" # Card backgrounds
  star_dust: "#1a2332" # Borders, dividers
  synapse_cyan: "#00d4ff" # Primary accent (arm color 1)
  dendrite_violet: "#a78bfa" # Secondary accent (arm color 2)
  axon_amber: "#ffb020" # Tertiary accent (arm color 3)
  text_bright: "#f1f5f9" # Primary text
  text_dim: "#94a3b8" # Secondary text
  text_faint: "#64748b" # Muted text, labels

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude: # Languages to hide from the telemetry chart
    - "Shell"
    - "Makefile"
    - "HTML"
    - "CSS"
  max_display: 8 # Maximum number of languages to show
